<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>欠席・振替のご連絡</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 80px; color: #555; }
    .spinner { margin: 0 auto 16px; width: 32px; height: 32px; border: 4px solid #eee; border-top-color: #06c755; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notice { max-width: 320px; margin: 0 auto; padding: 0 16px; line-height: 1.7; color: #333; }
    .btn { display: inline-block; margin-top: 24px; padding: 12px 36px; background: #06c755; color: #fff; border: none; border-radius: 24px; font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p id="msg">読み込んでいます…</p>
  </div>
  <div id="consentNotice" style="display:none;">
    <p class="notice">欠席連絡には、本人確認のため、初回のみ確認画面が表示されます。表示されたら「許可する」を選んでください。</p>
    <button class="btn" id="proceedBtn" type="button">進む</button>
  </div>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // 2026-09-09: このページはGoogle Apps Scriptではなく、GitHub Pages(静的ホスティング)上に
    // 単独で配置している。GASのWebアプリは全ページを入れ子のサンドボックス化iframeで包んでしまい、
    // LIFFが公式に非対応とする「iframeに埋め込まれた状態」を作ってしまうため、liff.init()が
    // 完了しないまま固まる不具合が実機(LINEアプリ)で確認された。このページ自体はGoogleの
    // ラッピングを受けないトップレベルの独立ページなので、その問題を回避できる。
    var LIFF_ID = '2011507426-tZhrl4fx';
    var GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbyrnq8-V17V67NAcbJ2co1LHTKT0NYyjtjA7jy8QIpm49artVQrrnpI27YoMeKNEwmN/exec';

    (async function () {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          if (!liff.isInClient()) {
            document.getElementById('msg').textContent = 'お手数ですが、LINEアプリのメニューにある「欠席・遅刻連絡」からお開きください。';
            return;
          }
          document.getElementById('loading').style.display = 'none';
          document.getElementById('consentNotice').style.display = 'block';
          document.getElementById('proceedBtn').addEventListener('click', function () {
            liff.login();
          });
          return;
        }
        var idToken = liff.getIDToken();
        if (!idToken) {
          document.getElementById('msg').textContent = 'ログイン情報の取得に失敗しました。時間をおいて再度お試しください。';
          return;
        }
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = GAS_EXEC_URL;
        function addField(name, value) {
          var el = document.createElement('input');
          el.type = 'hidden';
          el.name = name;
          el.value = value;
          form.appendChild(el);
        }
        addField('flow', 'absence');
        addField('action', 'liffAuth');
        addField('idToken', idToken);
        document.body.appendChild(form);
        form.submit();
      } catch (e) {
        document.getElementById('msg').textContent = 'エラーが発生しました。時間をおいて再度お試しください。';
      }
    })();
  </script>
</body>
</html>
