<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>読み込み中</title>
<style>
html, body { margin: 0; height: 100%; background: #f3ebdf; }
body { font-family: "Noto Sans JP", system-ui, sans-serif; color: #6a6055; }
#loading, #consentNotice { text-align: center; padding-top: 88px; }
.spinner { margin: 0 auto 18px; width: 30px; height: 30px; border: 3px solid #e6dbca; border-top-color: #2d9cdb; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
p { font-size: 14px; line-height: 1.8; margin: 0 auto; max-width: 300px; padding: 0 20px; }
.btn { display: inline-block; margin-top: 26px; padding: 13px 38px; background: #2d9cdb; color: #fff; border: 0; border-radius: 999px; font-size: 15px; font-weight: 700; font-family: inherit; }
#app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #f3ebdf; }
</style>
</head>
<body>
<!-- WALK, 入口ページ(全塾共通)。/s/<塾キー>/ と /s/<塾キー>/hub/ はすべてこのページ(_redirects)。 -->
<div id="loading">
<div class="spinner"></div>
<p id="msg">読み込んでいます…</p>
</div>
<div id="consentNotice" style="display:none;">
<p id="consentText"></p>
<button class="btn" id="proceedBtn" type="button">進む</button>
</div>
<iframe id="app" name="app" title=""></iframe>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="/schools.js"></script>
<script src="/walk-entry.js"></script>
</body>
</html>
