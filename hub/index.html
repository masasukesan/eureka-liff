<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マイページ</title>
<style>
html, body { margin: 0; height: 100%; background: #f3ebdf; }
body { font-family: "Noto Sans JP", system-ui, sans-serif; color: #6a6055; }
#loading { text-align: center; padding-top: 88px; }
.spinner { margin: 0 auto 18px; width: 30px; height: 30px; border: 3px solid #e6dbca; border-top-color: #2d9cdb; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
p { font-size: 14px; line-height: 1.8; margin: 0 auto; max-width: 300px; padding: 0 20px; }
.btn { display: inline-block; margin-top: 26px; padding: 13px 38px; background: #2d9cdb; color: #fff; border: 0; border-radius: 999px; font-size: 15px; font-weight: 700; font-family: inherit; }
#app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #f3ebdf; }
</style>
</head>
<body>
<div id="loading">
<div class="spinner"></div>
<p id="msg">読み込んでいます…</p>
</div>
<div id="consentNotice" style="display:none; text-align:center; padding-top:88px;">
<p>ご本人の確認のため、初回だけ確認画面が出ます。表示されたら「許可する」を選んでください。</p>
<button class="btn" id="proceedBtn" type="button">進む</button>
</div>
<iframe id="app" name="app" title="マイページ"></iframe>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// 2026-09-24 本番化: マイページをiframeに入れて、Googleの「このアプリケーションは…」の帯を出さない版。
// GAS側の 14_hub_embed.gs と対になっている。GASの画面は自分へのリンク/フォームを
// postMessage で「開いて」「送って」と頼んでくるので、ここで iframe に流し込む。
var LIFF_ID = '2011507426-FOY9141W';
var GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbzBdIkY05qZrrbJKgJ-AGByfFIk41ey1yIdugYPOojR7pLtnHvRQ29CcLIqDS9sChpcPA/exec';
var frame = document.getElementById('app');
var msg = document.getElementById('msg');
var shown = false;
function stopSpin() {
  var sp = document.querySelector('.spinner');
  if (sp) { sp.style.display = 'none'; }
}
function showApp() {
  if (shown) return;
  shown = true;
  document.getElementById('loading').style.display = 'none';
  frame.style.display = 'block';
}
function postToFrame(url, fields) {
  var form = document.createElement('form');
  form.method = 'POST';
  form.action = url;
  form.target = 'app';
  form.style.display = 'none';
  for (var i = 0; i < fields.length; i++) {
    var el = document.createElement('input');
    el.type = 'hidden';
    el.name = String(fields[i][0]);
    el.value = String(fields[i][1]);
    form.appendChild(el);
  }
  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);
}
function isOurExec(u) {
  return typeof u === 'string' && (u === GAS_EXEC_URL || u.indexOf(GAS_EXEC_URL + '?') === 0);
}
window.addEventListener('message', function (ev) {
  // GASの画面(googleusercontent.com)からの頼みだけ受ける。
  if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(ev.origin || '')) return;
  var d = ev.data;
  if (!d || typeof d !== 'object') return;
  if (d.walk === 'ready') { showApp(); return; }
  if (d.walk === 'nav' && isOurExec(d.url)) { frame.src = d.url; return; }
  if (d.walk === 'post' && isOurExec(d.url) && Array.isArray(d.fields)) { postToFrame(d.url, d.fields); return; }
});
// 念のため: readyが来なくても、iframeが読み込み終わったら表示する(旧端末対策)。
frame.addEventListener('load', function () { if (frame.getAttribute('data-started')) setTimeout(showApp, 1500); });
(async function () {
  try {
    await liff.init({ liffId: LIFF_ID });
    msg.textContent = 'ログインを確認しています…';
    if (!liff.isLoggedIn()) {
      if (!liff.isInClient()) {
        stopSpin();
        msg.textContent = 'お手数ですが、LINEアプリのメニューにある「マイページ」からお開きください。';
        return;
      }
      document.getElementById('loading').style.display = 'none';
      document.getElementById('consentNotice').style.display = 'block';
      document.getElementById('proceedBtn').addEventListener('click', function () { liff.login(); });
      return;
    }
    var idToken = liff.getIDToken();
    if (!idToken) {
      stopSpin();
      msg.textContent = 'ログイン情報を取得できませんでした。時間をおいてお試しください。';
      return;
    }
    msg.textContent = '本人確認をしています…';
    frame.setAttribute('data-started', '1');
    postToFrame(GAS_EXEC_URL, [['action', 'liffAuth'], ['idToken', idToken]]);
  } catch (e) {
    stopSpin();
    msg.textContent = 'エラーが発生しました。時間をおいてお試しください。';
  }
})();
</script>
</body>
</html>
